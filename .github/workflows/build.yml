name: Build tinycore-s905 kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel stable/LTS version"
        required: true
        default: "6.18.55"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.18.55' }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            pahole \
            pkg-config \
            python3 \
            rsync \
            xz-utils \
            zstd

      - name: Build kernel
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinycore-s905-kernel-${{ env.KERNEL_VERSION }}-n1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: tinycore-s905-kernel-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release archive
        run: |
          cd release-artifacts
          tar -cJf "../tinycore-s905-kernel-${GITHUB_REF_NAME}-n1.tar.xz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tinycore-s905-kernel-${{ github.ref_name }}-n1.tar.xz
            release-artifacts/SHA256SUMS
            release-artifacts/build-info.txt
