name: Build S905 pCP kernel - Route B

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel branch/tag"
        required: true
        default: "6.12.y"
      kernel_repo:
        description: "Kernel source repository"
        required: true
        default: "https://github.com/unifreq/linux-6.12.y.git"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.12.y' }}
      KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/unifreq/linux-6.12.y.git' }}
      DEBIAN_FRONTEND: noninteractive

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            gcc-aarch64-linux-gnu \
            git libelf-dev libssl-dev \
            rsync cpio xz-utils zstd \
            device-tree-compiler kmod

      - name: Prepare build script
        run: |
          set -euo pipefail

          test -f scripts/build.sh
          test -f config/n1-pcp.fragment

          # Never rely on executable bits surviving ZIP/local filesystem/checkout.
          chmod 0755 scripts/build.sh

          echo "==> build.sh permissions"
          stat -c '%A %a %n' scripts/build.sh

          echo "==> build.sh syntax check"
          bash -n scripts/build.sh

          echo "==> fragment"
          stat -c '%A %a %n' config/n1-pcp.fragment

      - name: Run kernel build script
        run: |
          set -euo pipefail
          bash ./scripts/build.sh

      - name: Verify build output
        run: |
          set -euo pipefail

          test -f .work/package/boot/Image
          test -f .work/package/boot/dtb/amlogic/meson-gxl-s905d-phicomm-n1.dtb
          test -f .work/package/kernel.config
          test -f .work/package/kernel.commit

          echo "==> Build output"
          find .work/package -maxdepth 5 -type f -print | sort

          echo "==> Image"
          file .work/package/boot/Image

          echo "==> N1 DTB"
          file .work/package/boot/dtb/amlogic/meson-gxl-s905d-phicomm-n1.dtb

      - name: Package artifact
        run: |
          set -euo pipefail

          tar -C .work \
            -czf "s905-pcp-routeB-${KERNEL_VERSION}.tar.gz" \
            package

          sha256sum "s905-pcp-routeB-${KERNEL_VERSION}.tar.gz"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: s905-pcp-routeB-${{ env.KERNEL_VERSION }}
          path: |
            s905-pcp-routeB-${{ env.KERNEL_VERSION }}.tar.gz
            .work/package/kernel.config
            .work/package/kernel.commit
