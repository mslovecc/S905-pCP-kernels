name: Build S905 piCorePlayer kernel (in-tree)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel stable version"
        required: true
        default: "6.12.67"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.12.67' }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            rsync \
            u-boot-tools

      - name: Show build version
        run: |
          echo "Requested kernel version: ${KERNEL_VERSION}"
          echo "==> Repository files"
          ls -la
          ls -la config scripts .github/workflows
          echo "==> Normalize executable bit"
          chmod +x scripts/build.sh
          test -f config/n1.fragment
          test -f scripts/build.sh
          test -f .github/workflows/build.yml
          sha256sum config/n1.fragment scripts/build.sh .github/workflows/build.yml

      - name: Build kernel
        run: |
          chmod +x scripts/build.sh
          KERNEL_VERSION="${KERNEL_VERSION}" ./scripts/build.sh

      - name: Prepare artifacts
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          cp -a .work/package/kernel/. artifacts/
          tar -C artifacts -czf "S905-pCP-kernel-${KERNEL_VERSION}-n1.tar.gz" \
            boot config rootfs
          rm -rf artifacts/rootfs
          find artifacts -maxdepth 3 -type f -print | sort

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: S905-pCP-kernel-${{ env.KERNEL_VERSION }}-n1
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
