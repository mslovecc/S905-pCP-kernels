name: Build pCP N1 kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel series"
        required: true
        default: "6.12.y"
        type: choice
        options:
          - 6.12.y
          - 6.18.y
      kernel_auto:
        description: "Use latest kernel in the selected series"
        required: true
        default: true
        type: boolean
      kernel_toolchain:
        description: "Kernel toolchain"
        required: true
        default: "gcc"
        type: choice
        options:
          - gcc
          - clang
      kernel_package:
        description: "Package list"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - image
          - dtbs
          - modules
      kernel_sign:
        description: "Kernel local version suffix"
        required: true
        default: "-pcp-n1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          set -euo pipefail
          test -f .github/workflows/build.yml
          test -f README.md
          echo "S905-pCP-kernels v0.3.1"
          echo "Workflow uses ophub/amlogic-s9xxx-armbian@main"
          echo "Kernel series: ${{ inputs.kernel_version }}"
          echo "Kernel auto:    ${{ inputs.kernel_auto }}"
          echo "Toolchain:      ${{ inputs.kernel_toolchain }}"
          echo "Package:        ${{ inputs.kernel_package }}"
          echo "Sign:           ${{ inputs.kernel_sign }}"

      - name: Compile kernel with ophub
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: ${{ inputs.kernel_auto }}
          kernel_package: ${{ inputs.kernel_package }}
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          kernel_sign: ${{ inputs.kernel_sign }}
          config_flavor: stable
          kernel_patch: kernel-patch
          auto_patch: false
          compress_format: xz
          delete_source: false
          silent_log: false
          enable_log: true

      - name: Show ophub outputs
        run: |
          set -euo pipefail
          echo "PACKAGED_STATUS=${PACKAGED_STATUS:-unset}"
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH:-unset}"
          echo "PACKAGED_OUTPUTTAGS=${PACKAGED_OUTPUTTAGS:-unset}"
          echo
          if [[ -n "${PACKAGED_OUTPUTPATH:-}" && -d "${PACKAGED_OUTPUTPATH}" ]]; then
            find "${PACKAGED_OUTPUTPATH}" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          else
            find . -maxdepth 5 -type f \( -name '*Image*' -o -name '*.dtb' -o -name '*.tar.*' -o -name '*.deb' \) -print | sort || true
          fi

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pcp-n1-kernel-${{ inputs.kernel_version }}
          path: |
            compile-kernel/output/**
          if-no-files-found: warn
          retention-days: 14
