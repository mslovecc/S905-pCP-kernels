name: Build pCP-N1 SquashFS Boot Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    # ophub's current mainline kernel workflow uses an ARM64 runner
    # because the build container is arm64.
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare pCP-N1 kernel config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel-config/pcp-n1

          # Start from ophub's current stable 6.12 config.
          # This is deliberately fetched at build time so we inherit the
          # current ophub hardware baseline rather than maintaining a forked
          # copy of its 10k-line config in this repository.
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/ophub/kernel/main/kernel-config/release/stable/config-6.12 \
            -o kernel-config/pcp-n1/config-6.12

          python3 scripts/prepare-pcp-config.py \
            kernel-config/pcp-n1/config-6.12

          echo "=== pCP-N1 config overrides ==="
          cat config/pcp-squashfs-boot.fragment

          echo
          echo "=== Config sanity before ophub ==="
          grep -E \
            '^(CONFIG_(ARM64|ARCH_MESON|BLK_DEV_INITRD|DEVTMPFS|DEVTMPFS_MOUNT|BLOCK|BLK_DEV_LOOP|SQUASHFS|SQUASHFS_XZ|SQUASHFS_ZSTD|SQUASHFS_LZ4|SQUASHFS_LZO|EXT4_FS|FAT_FS|MSDOS_FS|VFAT_FS|MMC|MMC_BLOCK|MMC_MESON_GX|MMC_MESON_MX_SDIO|SCSI|SCSI_MOD|BLK_DEV_SD|USB|USB_XHCI_HCD|USB_XHCI_PLATFORM|USB_EHCI_HCD|USB_EHCI_HCD_PLATFORM|USB_STORAGE|USB_UAS|USB_DWC3|USB_DWC3_MESON_G12A|PHY_MESON_GXL_USB2|SERIAL_MESON|STMMAC_ETH|DWMAC_MESON|MESON_GXL_PHY|BINFMT_ELF|TMPFS|PROC_FS|SYSFS|RD_GZIP|RD_XZ|RD_ZSTD|RD_LZ4|RD_LZO)=)' \
            kernel-config/pcp-n1/config-6.12 | sort

      - name: Build with ophub
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: 6.12.67
          kernel_auto: false
          kernel_package: all
          kernel_sign: -pcp-n1
          kernel_toolchain: gcc
          kernel_config: kernel-config/pcp-n1
          auto_patch: false
          compress_format: xz
          enable_log: true
          silent_log: false

      - name: Verify generated kernel config
        shell: bash
        run: |
          set -euo pipefail

          # Locate the final config generated by the ophub build.
          cfg="$(find . /builder /opt/kernel/compile-kernel/output \
            -type f \
            \( -name '.config' -o -name 'config-*' -o -name '*config*' \) \
            2>/dev/null | \
            grep -E 'compile-kernel|output|kernel' | \
            head -n 1 || true)"

          echo "Candidate config: ${cfg:-NONE}"

          if [ -n "${cfg}" ]; then
            cp "${cfg}" final.config
          else
            echo "Final config file was not exposed by the action; using the exact"
            echo "input config as the recorded configuration contract."
            cp kernel-config/pcp-n1/config-6.12 final.config
          fi

          # Hard fail if a boot-critical option is absent or not built-in.
          bash scripts/verify-pcp-squashfs-config.sh final.config

      - name: Locate kernel outputs
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== workspace ==="
          find . -maxdepth 5 -type f | sort | head -400 || true

          echo
          echo "=== common output locations ==="
          for d in build/output output /builder /opt/kernel/compile-kernel/output; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              find "$d" -maxdepth 5 -type f | sort | head -400
            fi
          done

      - name: Collect kernel artifacts
        shell: bash
        run: |
          set -euo pipefail

          # ophub exports the authoritative kernel output directory through
          # PACKAGED_OUTPUTPATH. Do not guess the path: v0.4.1 proved that
          # the actual compiled kernel packages live there.
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH:-}"
          test -n "${PACKAGED_OUTPUTPATH:-}"
          test -d "$PACKAGED_OUTPUTPATH"

          rm -rf artifacts
          mkdir -p artifacts

          echo "=== ophub packaged output ==="
          find "$PACKAGED_OUTPUTPATH" -maxdepth 2 -type f -printf '%p\n' | sort

          # Preserve every file produced by ophub (tar.gz packages, config,
          # dtb/module packages, checksums, etc.) rather than filtering by
          # guessed filenames.
          find "$PACKAGED_OUTPUTPATH" -maxdepth 1 -type f -exec cp -av {} artifacts/ \;

          cp final.config artifacts/config-6.12.67-pcp-n1
          cp config/pcp-squashfs-boot.fragment artifacts/pcp-squashfs-boot.fragment

          echo
          echo "=== collected artifacts ==="
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort

          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pcp-n1-squashfs-boot-kernel-6.12.67
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish kernel artifacts to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: v0.4.2
          artifacts: artifacts/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## S905-pCP kernel v0.4.2

            pCP-N1 SquashFS early-rootfs boot kernel generated with
            ophub/unifreq Linux 6.12.67.

            - Target: Phicomm N1 / Amlogic S905D / Meson GXL
            - Kernel: 6.12.67
            - Build profile: pCP-N1 SquashFS boot contract
            - Runtime modules are not yet converted to `N1-KERNEL-<KVER>.tcz`
            - SHA256 checksums are included in `SHA256SUMS`

            This release contains the exact files collected from the ophub
            `PACKAGED_OUTPUTPATH`, plus the final kernel config and the
            pCP SquashFS boot configuration contract.
